[project]
name = "ai-support-agent"
version = "0.1.0"
description = "AWS AgentCore electronics customer-support agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "bedrock-agentcore>=1.22.0,<2",
  "boto3>=1.43.0,<2",
  "httpx>=0.28.0,<1",
  "mcp>=1.26.0,<3",
  "nest-asyncio>=1.6.0,<2",
  "playwright>=1.58.0,<2",
  "pydantic>=2.13.0,<3",
  "strands-agents>=1.54.0,<2",
  "strands-agents-tools>=0.8.0,<1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.116.0,<1",
  "itsdangerous>=2.2.0,<3",
  "pyjwt[crypto]>=2.10.0,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "bedrock-agentcore-starter-toolkit>=0.3.12,<1",
  "cfn-lint>=1.44.0,<2",
  "mypy>=1.19.0,<3",
  "pytest>=9.0.0,<10",
  "pytest-asyncio>=1.3.0,<2",
  "ruff>=0.15.0,<1",
  "fastapi>=0.116.0,<1",
  "itsdangerous>=2.2.0,<3",
  "pyjwt[crypto]>=2.10.0,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
