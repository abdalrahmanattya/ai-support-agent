name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.8.22", enable-cache: true }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy main.py support_agent lambdas domain apps/api
      - run: uv run cfn-lint infrastructure/*.yaml
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
