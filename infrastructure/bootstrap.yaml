AWSTemplateFormatVersion: "2010-09-09"
Description: Private artifact bucket for the CircuitCare AgentCore deployment.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: ai-support-agent
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  ArtifactBucketName:
    Description: Bucket used for deployable code and knowledge documents.
    Value: !Ref ArtifactBucket
    Export:
      Name: ai-support-agent-artifact-bucket
